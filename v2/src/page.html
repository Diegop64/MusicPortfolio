<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{seo_title}}</title>
  <meta name="description" content="{{seo_description}}">{{{meta_keywords}}}
  <meta name="author" content="{{name}}">
  <meta name="theme-color" content="#1F1C19">
  <link rel="canonical" href="{{canonical}}">
{{{hreflang_links}}}
  <link rel="icon" href="{{root}}favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{root}}images/favicon-32x32.png">
  <link rel="apple-touch-icon" href="{{root}}images/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{og_locale}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="{{brand}}">
  <meta property="og:title" content="{{seo_title}}">
  <meta property="og:description" content="{{seo_description}}">
  <meta property="og:image" content="{{og_image}}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
  <link rel="stylesheet" href="{{root}}css/style.css?v={{asset_v}}">

  {{{analytics}}}
  {{{jsonld}}}
</head>
<body>
  <a class="skip" href="{{skip_target}}">{{skip_text}}</a>

  <header class="nav">
    <a class="nav-mark" href="{{home_href}}">{{brand}}</a>
    <nav aria-label="{{t_nav}}">
      <ul>
{{{nav_items}}}
      </ul>
    </nav>
  </header>

  <main id="main">
{{{content}}}
  </main>

  <footer class="footer">
    <p class="footer-mark">{{brand}}</p>
    <nav class="footer-nav" aria-label="{{t_footer_nav}}"><ul>
{{{footer_nav}}}
    </ul></nav>
    <p>{{location}}</p>
    <p><a href="mailto:{{email}}">{{email}}</a></p>
    <p class="footer-social">{{{social_links}}}</p>
    <p class="footer-copy">© {{year}} {{brand}}</p>
  </footer>

  <script>window.DM_I18N = {{{js_i18n}}};</script>
  <script src="{{root}}js/main.js?v={{asset_v}}" defer></script>
</body>
</html>
